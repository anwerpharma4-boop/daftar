# Builds installable files on every push (or manually from the Actions tab):
#   - daftar-android.apk  : install directly on Android
#   - daftar-ios-unsigned.ipa : sideload on iPhone/iPad with Sideloadly or AltStore
#     (they sign it with your own Apple ID).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Generate platform folders if missing
        run: '[ -d android ] || bash setup.sh'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk daftar-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daftar-android
          path: daftar-android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Generate platform folders if missing
        run: '[ -d ios ] || bash setup.sh'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr daftar-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: daftar-ios
          path: daftar-ios-unsigned.ipa
