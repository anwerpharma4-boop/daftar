  pdf: ^3.11.1
  record: ^7.1.2
  audioplayers: ^6.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
